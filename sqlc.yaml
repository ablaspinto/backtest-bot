version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/adapters/postgresql/sqlc/"
    schema: "./internal/adapters/postgresql/migrations/"
    gen:
      go:
        package: "repo"
        out: "./internal/adapters/postgresql/sqlc/"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        sql_package: "pgx/v5"
