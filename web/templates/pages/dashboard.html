{{define "dashboard"}}
<div class="dashboard">
    <header class="page-header">
        <h1>Dashboard</h1>
        <input type="search" 
               name="q"
               hx-get="/htmx/candles/search"
               hx-trigger="input changed delay:300ms"
               hx-target="#search-results"
               placeholder="Search symbols...">
        <div id="search-results"></div>
    </header>

    <div class="grid">
        <!-- Stats loaded on page load -->
        <section class="card" hx-get="/htmx/candles/stqts?symbol=ES" hx-trigger="load" hx-swap="innerHTML">
            <div class="loading">Loading stats...</div>
        </section>

        <!-- Active Sessions -->
        <section class="card">
            <h2>Active Sessions</h2>
            <div hx-get="/htmx/sessions/active" hx-trigger="load, every 30s" hx-swap="innerHTML">
                <div class="loading">Loading...</div>
            </div>
        </section>
    </div>

    <!-- Candles Table -->
    <section class="card">
        <div class="card-header">
            <h2>Recent Candles</h2>
            <select hx-get="/htmx/candles/table" 
                    hx-target="#candles-table-body"
                    hx-include="this"
                    name="symbol">
                <option value="">All Symbols</option>
                <option value="ES">ES</option>
                <option value="NQ">NQ</option>
                <option value="CL">CL</option>
            </select>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>TF</th>
                    <th>Open</th>
                    <th>High</th>
                    <th>Low</th>
                    <th>Close</th>
                    <th>Volume</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="candles-table-body" 
                   hx-get="/htmx/candles/table" 
                   hx-trigger="load"
                   hx-swap="innerHTML">
                <tr><td colspan="8" class="loading">Loading candles...</td></tr>
            </tbody>
        </table>
    </section>
</div>
{{end}}
